name: probe
on:
  push:
    branches: [probe/direct-fields]
    paths: ['.github/workflows/probe.yml', 'scripts/probe_direct.py']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe Direct API capabilities
        env:
          DIRECT_TOKEN: ${{ secrets.DIRECT_TOKEN }}
          CLIENT_LOGIN: ${{ secrets.CLIENT_LOGIN }}
        run: python scripts/probe_direct.py
