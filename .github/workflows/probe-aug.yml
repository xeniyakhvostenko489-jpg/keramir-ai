name: probe-aug
on:
  push:
    branches: [probe/aug]
    paths: ['.github/workflows/probe-aug.yml', 'scripts/probe_aug.py']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: August reconciliation
        env:
          DIRECT_TOKEN: ${{ secrets.DIRECT_TOKEN }}
          CLIENT_LOGIN: ${{ secrets.CLIENT_LOGIN }}
        run: python scripts/probe_aug.py
